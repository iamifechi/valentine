<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Surprise surprise</title>
    <meta name="description" content="I have a question to ask you..." />
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hi, I have a question..." />
    <meta property="og:description" content="Please open this on a computer for a surprise!" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
  </head>
  <body>
    <div id="mobile-blocker">
      <div class="blocker-content">
        <h1>📱</h1>
        <h2>Please use a Desktop!</h2>
        <p>This Valentine's surprise is best viewed on a larger screen.</p>
      </div>
    </div>
    <main id="question">
      <h1 id="greeting">Hi,</h1>
      <p class="question">Will you be my valentine?</p>
      <div class="btn-container">
        <button id="yes" class="btn">Yes <span> 🤗 </span></button>
        <button id="no" title="Please na🥲!!!" class="btn">No <span>🥲</span></button>
      </div>
    </main>
    <main id="response">
      <img
        src="https://c.tenor.com/0Sh7u1lRsyEAAAAC/tenor.gif"
        alt="Celebration and popping champagne"
      />

      <h1>YES!!!</h1>
    </main>

    <script defer src="app.js"></script>
  </body>
</html>
